<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found — Nei González</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .error-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .error-text {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--navy);
            color: var(--white);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .error-btn:hover {
            background: var(--navy-light);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <div class="error-text">The page you are looking for does not exist or has been moved.<br>Please check the URL or return to the homepage.</div>
        <a href="/" class="error-btn">Back to Homepage</a>
    </div>
</body>
</html>
